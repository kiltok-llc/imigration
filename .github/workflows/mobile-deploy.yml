name: Mobile Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build for
        required: true
        type: choice
        options:
          - production
          - preview
  workflow_call:
    inputs:
      environment:
        description: Environment to build for
        required: true
        type: string

defaults:
  run:
    working-directory: 'apps/mobile'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            name: iOS
            os: macos-latest
    #          - platform: android
    #            name: Android
    #            os: ubuntu-latest

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.environment }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm add --global eas-cli
      - run: eas env:pull ${{ inputs.environment }} --non-interactive
      - id: build
        run: |
          turbo build:${{ matrix.platform }} -- --profile ${{ inputs.environment }}
          echo "path=$(realpath build/*)" >> $GITHUB_OUTPUT
      - id: upload
        run: echo "build-url=$(eas upload --non-interactive --json --platform ${{ matrix.platform }} --build-path ${{ steps.build.outputs.build-path }} | jq -r .url)" >> $GITHUB_OUTPUT
      - name: Job Summary
        if: inputs.environment == 'preview'
        run: |
          echo '## ${{ matrix.name }} App' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.upload.outputs.build-url }}' >> $GITHUB_STEP_SUMMARY

  push-update:
    name: Push Update
    runs-on: macos-latest
    environment: ${{ inputs.environment }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm add --global eas-cli
      - run: eas env:pull --non-interactive --environment ${{ inputs.environment }}
      - run: turbo build:update -- --environment ${{ inputs.environment }}
      - run: dotenvx run -f .env.local -- pnpx sentry-expo-upload-sourcemaps dist
