packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  eslint: ^9.36.0
  prettier: ^3.6.2
  tailwindcss: ^4.1.12
  typescript: ~5.9.2
  '@trpc/client': ^11.5.1
  '@trpc/server': ^11.5.1

catalogs:
  react19:
    react: 19.1.0
    react-dom: 19.1.0
    '@types/react': ~19.1.10
    '@types/react-dom': ^19.1.0

nodeLinker: hoisted

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@tailwindcss/oxide'
  - canvas
  - core-js
  - core-js-pure
  - esbuild
  - sharp
  - supabase
  - unrs-resolver

patchedDependencies:
  react-native-reanimated: patches/react-native-reanimated.patch
