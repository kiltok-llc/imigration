name: Mobile Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build for
        required: true
        type: choice
        options:
          - production
          - preview

  workflow_call:
    inputs:
      environment:
        description: Environment to build for
        required: true
        type: string

concurrency:
  group: ${{ inputs.environment }}-mobile-deploy

defaults:
  run:
    working-directory: 'apps/mobile'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            name: iOS
            os: macos-latest
          - platform: android
            name: Android
            os: ubuntu-latest

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.environment }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm add --global eas-cli

      - uses: actions/cache@v4
        with:
          path: previous-expo-fingerprint.txt
          key: fingerprint-${{ inputs.environment }}

      - run: eas fingerprint --non-interactive --json --platform ${{ matrix.platform }} > current-expo-fingerprint.txt

      - name: Compare fingerprints
        id: fingerprint
        run: |
          if [ -f previous-expo-fingerprint.txt ]; then
            if cmp -s current-expo-fingerprint.txt previous-expo-fingerprint.txt; then
              echo "Fingerprint unchanged, no native build needed"
              echo "build_needed=false" >> $GITHUB_OUTPUT
            else
              echo "Fingerprint changed, native build needed"
              echo "build_needed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Previous fingerprint not found, native build needed"
            echo "build_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Native Build
        if: steps.fingerprint.outputs.build_needed == 'true'
        run: eas build --non-interactive --platform ${{ matrix.platform }} --profile ${{ inputs.environment }} --message ${{ github.sha }}

      - name: EAS Update
        if: steps.fingerprint.outputs.build_needed == 'false'
        run: eas update --non-interactive --platform ${{ matrix.platform }} --channel ${{ inputs.environment }} --environment ${{ inputs.environment }} --message ${{ github.sha }}

      - name: Upload Sentry Sourcemaps
        if: steps.fingerprint.outputs.build_needed == 'false'
        run: |
          eas env:pull --non-interactive --environment ${{ inputs.environment }}
          dotenvx run -f .env.local -- pnpx sentry-expo-upload-sourcemaps dist

      - run: mv current-expo-fingerprint.txt previous-expo-fingerprint.txt

      - uses: actions/cache@v4
        with:
          path: previous-expo-fingerprint.txt
          key: fingerprint-${{ inputs.environment }}-${{ github.run_id }}
          restore-keys: |
            fingerprint-${{ inputs.environment }}
